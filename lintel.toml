version = 1
default_layer = "external"
default_scope = "external"

[paths]
core_root = "lintel/core"
adapters_root = "lintel/adapters"
entrypoints_root = "lintel/cli"

[analysis]
source_suffixes = [".py", ".go", ".rs", ".js", ".ts", ".tsx"]

[semantic_decision]
model = "liquid/d1.2"
endpoint = "https://openrouter.ai/api/alpha/decisions"
api_key_env = "OPENROUTER_API_KEY"
answer_key = "decision"
min_confidence = 0.85
timeout = 20
max_findings = 64

[scopes.external]
patterns = ["*"]
priority = 0

[scopes.test]
patterns = ["tests/**", "**/*_test.py", "**/*.test.ts"]
priority = 10

[scopes.fixture]
patterns = ["tests/fixtures/**"]
priority = 20

[scopes.example]
patterns = ["examples/**"]
priority = 10

[scopes.installer]
patterns = ["lintel-install.sh"]
priority = 30

[scope_rules]
excluded_scopes = ["fixture", "test", "example", "generated", "vendor", "installer"]

[scope_rules.conventions]
"tests/fixtures/" = "fixture"
"tests/" = "test"
"examples/" = "example"

[boundary_concerns.entrypoint_only]

[boundary_concerns.mechanism]
allowed_regions = ["adapters", "infrastructure", "entrypoints", "external"]

[wrapper_rules]
allowed_imports = [
  "argparse",
  "json",
  "os",
  "sys",
  "subprocess",
  "tempfile",
  "lintel.adapters.*",
  "lintel.core.model*",
  "lintel.core.use_cases.*",
  "lintel.core.hooks",
  "lintel.core.review",
  "lintel.core.version*",
]
forbidden_imports = [
  "lintel.core.checker",
  "lintel.core.rules",
  "lintel.core.ratchet"
]
allowed_commands = ["cargo", "go", "lake", "node", "python3"]

[use_cases]
allowed_imports = [
  "lintel.core.ports*",
  "lintel.core.model*",
  "typing*",
  "dataclasses*"
]

[layers.ports]
priority = 10
core = true
patterns = [
  "lintel.core.model*",
  "lintel.core.ports*",
  "lintel.core.rules*",
  "lintel.core.ratchet*",
  "lintel.core.presets*",
  "Lintel.Port*",
  "Lintel.CapabilityPort*",
  "Lintel.TypedCapabilityPort*",
  "Lintel.BoundaryDataLanguage*"
]
allowed = ["ports", "core", "platform"]
forbidden = [
  "lintel.cli.*",
  "check_facts",
  "check_self",
  "lintel.adapters.runtime",
  "lintel.adapters.extract_common"
]

[layers.core]
priority = 20
core = true
patterns = ["Lintel", "lintel.core.*"]
allowed = ["ports", "core", "platform"]
forbidden = [
  "lintel.cli.*",
  "check_facts",
  "check_self",
  "lintel.adapters.runtime",
  "lintel.adapters.extract_common"
]

[layers.platform]
priority = 30
core = true
patterns = [
  "argparse",
  "ast",
  "bytes",
  "collections",
  "contextlib",
  "core",
  "csv",
  "dataclasses*",
  "datetime",
  "encoding/json",
  "enum",
  "flag",
  "fnmatch*",
  "fmt",
  "glob",
  "go/parser",
  "go/token",
  "hashlib",
  "io",
  "itertools",
  "json",
  "logging",
  "math",
  "node:child_process",
  "node:fs",
  "node:path",
  "os",
  "os/exec",
  "path/filepath",
  "pathlib",
  "posixpath*",
  "random",
  "re",
  "shutil",
  "sort",
  "std",
  "strconv",
  "strings",
  "subprocess",
  "sys",
  "tempfile",
  "time",
  "tomllib",
  "traceback",
  "urllib",
  "urllib.error",
  "urllib.request",
  "typing*"
]
allowed = ["platform"]

[layers.entrypoints]
priority = 40
core = false
patterns = [
  "lintel.cli.*",
  "lintel",
  "check_facts",
  "check_self"
]
allowed = ["ports", "core", "platform", "adapters", "infrastructure", "external"]

[layers.infrastructure]
priority = 50
core = false
patterns = [
  "lintel.adapters.runtime",
  "lintel.adapters.config",
  "lintel.adapters.extract_common",
  "lintel.adapters.contract_facts",
  "lintel.adapters.contract_lock",
  "config",
  "contract_facts",
  "contract_lock",
  "extract_common",
]
allowed = ["ports", "core", "platform", "adapters", "infrastructure", "external"]

[layers.adapters]
priority = 60
core = false
patterns = [
  "lintel.adapters.*",
]
allowed = ["ports", "core", "platform", "adapters", "infrastructure", "external"]

[layers.external]
priority = 1000
core = false
patterns = ["*"]
allowed = ["external"]

[[executables]]
name = "lintel"
path = "lintel/cli/main.py"
owner = "entrypoints"

[[executables]]
name = "check_self"
path = "lintel/cli/check_self.py"
owner = "entrypoints"

[[executables]]
name = "check_facts"
path = "lintel/cli/check_facts.py"
owner = "entrypoints"
