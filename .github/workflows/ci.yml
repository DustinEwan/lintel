name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    name: Lean spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean spec
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: false

  python:
    name: Architecture checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install extractor dependencies
        run: npm ci

      - name: Compile Python sources
        run: python3 -m py_compile adapters/*.py adapters/language/*.py architecture_core/*.py architecture_core/use_cases/*.py external/cli/*.py tests/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check repository architecture
        run: |
          python3 external/cli/check_self.py --out /tmp/architecture-facts.json
          python3 external/cli/check_architecture.py /tmp/architecture-facts.json --config architecture.toml

      - name: Generate and check Lean instance
        run: |
          python3 external/cli/architecture.py generate-lean --out /tmp/ArchitectureFacts.lean
          source "$HOME/.elan/env"
          lake env lean /tmp/ArchitectureFacts.lean
