version = 1
default_layer = "external"
default_scope = "external"

[paths]
core_root = "architecture_core"
adapters_root = "adapters"
entrypoints_root = "external/cli"

[scopes.external]
patterns = ["*"]
priority = 0

[scopes.test]
patterns = ["tests/**", "**/*_test.py", "**/*.test.ts"]
priority = 10

[scopes.fixture]
patterns = ["tests/fixtures/**"]
priority = 20

[scopes.example]
patterns = ["examples/**"]
priority = 10

[scopes.build_artifact]
patterns = [
  "adapters/extract_typescript_native.mjs",
  "adapters/go-extractor/main.go",
  "adapters/rust-extractor/src/main.rs"
]
priority = 30

[scope_rules]
excluded_scopes = ["fixture", "test", "example", "generated", "vendor"]
forbidden_edges = []

[scope_rules.conventions]
"tests/fixtures/" = "fixture"
"tests/" = "test"
"examples/" = "example"

[boundary_concerns.entrypoint_only]
patterns = [
  "argparse",
  "typer",
  "click",
  "sys.argv",
  "sys.exit",
  "os._exit",
  "flag.Parse",
  "std::env::args",
  "std::process::exit",
  "process.argv",
  "process.exit"
]

[boundary_concerns.mechanism]
patterns = [
  "os.environ",
  "logging",
  "print",
  "os.Getenv",
  "std::env::var",
  "process.env",
  "fmt.Print",
  "println!",
  "SystemExit",
  "console.log"
]
allowed_regions = ["adapters", "infrastructure", "entrypoints", "external"]

[wrapper_rules]
allowed_imports = [
  "argparse",
  "json",
  "os",
  "sys",
  "subprocess",
  "tempfile",
  "adapters.*",
  "architecture_core.model*",
  "architecture_core.use_cases.*"
]
forbidden_imports = [
  "architecture_core.checker",
  "architecture_core.rules",
  "architecture_core.ratchet"
]
allowed_commands = ["cargo", "go", "node", "python3"]

[use_cases]
allowed_imports = [
  "architecture_core.ports*",
  "architecture_core.model*",
  "typing*",
  "dataclasses*"
]

[layers.ports]
priority = 10
core = true
patterns = [
  "architecture_core.model*",
  "architecture_core.ports*",
  "architecture_core.rules*",
  "architecture_core.ratchet*",
  "architecture_core.presets*",
  "Architecture.Port*",
  "Architecture.CapabilityPort*",
  "Architecture.TypedCapabilityPort*",
  "Architecture.BoundaryDataLanguage*"
]
allowed = ["ports", "core", "platform"]
forbidden = [
  "external.cli.*",
  "check_architecture",
  "check_self",
  "adapters.*_extractor",
  "adapters.extract_*",
  "extract_*",
  "rust_extractor",
  "architecture-extractors/go-extractor",
  "extract_common",
  "adapters.runtime"
]

[layers.core]
priority = 20
core = true
patterns = ["Architecture", "architecture_core.*"]
allowed = ["ports", "core", "platform"]
forbidden = [
  "external.cli.*",
  "check_architecture",
  "check_self",
  "adapters.*_extractor",
  "adapters.extract_*",
  "extract_*",
  "rust_extractor",
  "architecture-extractors/go-extractor",
  "extract_common",
  "adapters.runtime"
]

[layers.platform]
priority = 30
core = true
patterns = [
  "argparse",
  "ast",
  "bytes",
  "collections",
  "contextlib",
  "core",
  "csv",
  "dataclasses*",
  "datetime",
  "encoding/json",
  "enum",
  "flag",
  "fnmatch*",
  "fmt",
  "glob",
  "go/parser",
  "go/token",
  "hashlib",
  "io",
  "itertools",
  "json",
  "logging",
  "math",
  "node:child_process",
  "node:fs",
  "node:path",
  "os",
  "os/exec",
  "path/filepath",
  "pathlib",
  "posixpath*",
  "random",
  "re",
  "shutil",
  "sort",
  "std",
  "strconv",
  "strings",
  "subprocess",
  "sys",
  "tempfile",
  "time",
  "tomllib",
  "traceback",
  "typing*"
]
allowed = ["platform"]

[layers.entrypoints]
priority = 40
core = false
patterns = [
  "external.cli.*",
  "architecture",
  "check_architecture",
  "check_self",
  "extract_python",
  "extract_go",
  "extract_rust",
  "extract_typescript"
]
allowed = ["ports", "core", "platform", "adapters", "infrastructure", "external"]

[layers.infrastructure]
priority = 50
core = false
patterns = [
  "adapters.runtime",
  "adapters.architecture_config",
  "adapters.extract_common",
  "adapters.contract_facts",
  "adapters.contract_lock",
  "architecture_config",
  "contract_facts",
  "contract_lock",
  "extract_common",
  "adapters.language",
  "adapters.language.*",
]
allowed = ["ports", "core", "platform", "infrastructure", "external"]

[layers.adapters]
priority = 60
core = false
patterns = [
  "adapters.*_extractor",
  "adapters.extract_*",
  "extract_*",
  "extract_typescript_native",
  "rust_extractor",
  "architecture-extractors/go-extractor"
]
allowed = ["ports", "core", "platform", "adapters", "infrastructure", "external"]

[layers.external]
priority = 1000
core = false
patterns = ["*"]
allowed = ["external"]

[[executables]]
name = "architecture"
path = "external/cli/architecture.py"
owner = "entrypoints"

[[executables]]
name = "check_self"
path = "external/cli/check_self.py"
owner = "entrypoints"

[[executables]]
name = "check_architecture"
path = "external/cli/check_architecture.py"
owner = "entrypoints"

[[executables]]
name = "extract_python"
path = "external/cli/extract_python.py"
owner = "entrypoints"

[[executables]]
name = "extract_go"
path = "external/cli/extract_go.py"
owner = "entrypoints"

[[executables]]
name = "extract_rust"
path = "external/cli/extract_rust.py"
owner = "entrypoints"

[[executables]]
name = "extract_typescript"
path = "external/cli/extract_typescript.py"
owner = "entrypoints"

[[executables]]
name = "extract_rust_native"
path = "external/cli/extract_rust_native.py"
owner = "entrypoints"

[[executables]]
name = "extract_go_native"
path = "external/cli/extract_go_native.py"
owner = "entrypoints"

[[executables]]
name = "extract_typescript_native"
path = "external/cli/extract_typescript_native.py"
owner = "entrypoints"

[[build_artifacts]]
source = "adapters/rust-extractor/src/main.rs"
wrapper = "extract_rust_native"

[[build_artifacts]]
source = "adapters/go-extractor/main.go"
wrapper = "extract_go_native"

[[build_artifacts]]
source = "adapters/extract_typescript_native.mjs"
wrapper = "extract_typescript_native"
