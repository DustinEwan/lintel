version = 1
default_layer = "external"
default_scope = "external"

[paths]
core_root = "core"
adapters_root = "adapters"
entrypoints_root = "entrypoints"

[analysis]
source_suffixes = ['.go']

[boundary_concerns.entrypoint_only]

[boundary_concerns.mechanism]
allowed_regions = ["adapters", "entrypoints", "external"]

[scopes.external]
patterns = ["*"]
priority = 0

[scopes.test]
patterns = ["tests/**", "**/*_test.py", "**/*.test.ts"]
priority = 10

[scopes.fixture]
patterns = ["tests/fixtures/**"]
priority = 20

[scope_rules]
excluded_scopes = ["fixture", "test", "generated", "vendor"]

[scope_rules.conventions]
"tests/" = "test"
"tests/fixtures/" = "fixture"

[layers.core]
priority = 20
core = true
patterns = ['example.com/pricing/core*', 'example.com/pricing/core/*', 'core.*']
allowed = ["core", "platform"]

[layers.platform]
priority = 30
core = true
patterns = ['encoding/json', 'errors', 'flag', 'fmt', 'os', 'sort', 'strconv', 'strings', 'time']
allowed = ["platform"]

[layers.entrypoints]
priority = 40
core = false
patterns = ['example.com/pricing/entrypoints*', 'example.com/pricing/entrypoints/*', 'entrypoints.*']
allowed = ["core", "platform", "adapters", "entrypoints", "external"]

[layers.adapters]
priority = 60
core = false
patterns = ['example.com/pricing/adapters*', 'example.com/pricing/adapters/*', 'adapters.*']
allowed = ["core", "platform", "adapters", "external"]

[layers.external]
priority = 1000
core = false
patterns = ["*"]
allowed = ["external"]

[[executables]]
name = "price"
path = "entrypoints/price/main.go"
owner = "entrypoints"
