version = 1
default_layer = "external"
default_scope = "external"

[paths]
core_root = "core"
adapters_root = "adapters"
entrypoints_root = "src/entrypoints"

[analysis]
source_suffixes = ['.rs']

[boundary_concerns.entrypoint_only]

[boundary_concerns.mechanism]
allowed_regions = ["adapters", "entrypoints", "external"]

[scopes.external]
patterns = ["*"]
priority = 0

[scopes.test]
patterns = ["tests/**", "**/*_test.py", "**/*.test.ts"]
priority = 10

[scopes.fixture]
patterns = ["tests/fixtures/**"]
priority = 20

[scope_rules]
excluded_scopes = ["fixture", "test", "generated", "vendor"]

[scope_rules.conventions]
"tests/" = "test"
"tests/fixtures/" = "fixture"

[layers.core]
priority = 20
core = true
patterns = ['order_pricing::core::*', 'order_pricing::core', 'src.core.*']
allowed = ["core", "platform"]

[layers.platform]
priority = 30
core = true
patterns = ['std*', 'alloc*', 'core::*']
allowed = ["platform"]

[layers.entrypoints]
priority = 40
core = false
patterns = ['order_pricing::entrypoints::*', 'order_pricing::entrypoints', 'src.entrypoints.*']
allowed = ["core", "platform", "adapters", "entrypoints", "external"]

[layers.adapters]
priority = 60
core = false
patterns = ['order_pricing::adapters::*', 'order_pricing::adapters', 'src.adapters.*']
allowed = ["core", "platform", "adapters", "external"]

[layers.external]
priority = 1000
core = false
patterns = ["*"]
allowed = ["external"]

[[executables]]
name = "price"
path = "src/entrypoints/price.rs"
owner = "entrypoints"
